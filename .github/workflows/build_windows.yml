name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller InternManager.spec --noconfirm --clean

      - name: Zip the Application
        shell: pwsh
        run: |
          Compress-Archive -Path dist/InternManager -DestinationPath dist/InternManager_Win.zip

      - name: Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/InternManager_Win.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}