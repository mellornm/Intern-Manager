[project]
name = "intern_manager"
version = "1.2.0"
description = "A comprehensive desktop application for managing academic internships, evaluations, documents, and venue allocations."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Rodrigo Noronha de Mello", email = "mellornm@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Administration",
    "Framework :: PySide6",
]
dependencies = [
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "packaging>=25.0",
    "pyinstaller>=6.17.0",
    "pyside6>=6.10.1",
    "qtawesome>=1.4.0",
    "reportlab>=4.4.10",
    "requests>=2.32.5",
    "ruff>=0.14.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.1",
]
